<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Wizago wizard hat crest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#321a49"/>
      <stop offset="0.55" stop-color="#190d26"/>
      <stop offset="1" stop-color="#0b0512"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="62%" r="52%">
      <stop offset="0" stop-color="#e3c258" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e3c258" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#fdf0b8"/>
      <stop offset="0.38" stop-color="#e3c258"/>
      <stop offset="0.72" stop-color="#b98d24"/>
      <stop offset="1" stop-color="#8a6110"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e3a0"/>
      <stop offset="0.5" stop-color="#cfa533"/>
      <stop offset="1" stop-color="#7d570c"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d2467"/>
      <stop offset="1" stop-color="#2a0f33"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6df8c"/>
      <stop offset="0.5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8f6a12"/>
    </linearGradient>
    <mask id="moonMask">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="21.2" cy="14.6" r="5" fill="#000"/>
    </mask>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#aura)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
  <rect x="5" y="5" width="54" height="54" rx="11.2" fill="none" stroke="#d9b64a" stroke-width="0.55" opacity="0.45"/>

  <!-- corner diamonds -->
  <g fill="#d9b64a" opacity="0.7">
    <path d="M8.6 6.5 9.4 8.3 11.2 9.1 9.4 9.9 8.6 11.7 7.8 9.9 6 9.1 7.8 8.3z" opacity="0.55"/>
    <path d="M55.4 6.5 56.2 8.3 58 9.1 56.2 9.9 55.4 11.7 54.6 9.9 52.8 9.1 54.6 8.3z" opacity="0.55"/>
    <path d="M8.6 52.3 9.4 54.1 11.2 54.9 9.4 55.7 8.6 57.5 7.8 55.7 6 54.9 7.8 54.1z" opacity="0.55"/>
    <path d="M55.4 52.3 56.2 54.1 58 54.9 56.2 55.7 55.4 57.5 54.6 55.7 52.8 54.9 54.6 54.1z" opacity="0.55"/>
  </g>

  <!-- crescent moon -->
  <circle cx="17.8" cy="16.4" r="5.8" fill="url(#gold)" mask="url(#moonMask)" opacity="0.95"/>

  <!-- sparkles -->
  <g fill="url(#gold)">
    <path d="M48 21.6c.44 2.2 1.06 2.82 3.26 3.26-2.2.44-2.82 1.06-3.26 3.26-.44-2.2-1.06-2.82-3.26-3.26 2.2-.44 2.82-1.06 3.26-3.26z" opacity="0.9"/>
    <path d="M15.2 29.4c.3 1.5.7 1.9 2.2 2.2-1.5.3-1.9.7-2.2 2.2-.3-1.5-.7-1.9-2.2-2.2 1.5-.3 1.9-.7 2.2-2.2z" opacity="0.65"/>
    <path d="M49.2 32.6c.26 1.3.62 1.66 1.92 1.92-1.3.26-1.66.62-1.92 1.92-.26-1.3-.62-1.66-1.92-1.92 1.3-.26 1.66-.62 1.92-1.92z" opacity="0.5"/>
  </g>

  <!-- cone -->
  <path d="M32 7.8c1.7 4.2 3.1 10.4 4.1 17L42.8 44.4H21.2L27.9 24.8c1-6.6 2.4-12.8 4.1-17z" fill="url(#gold)"/>
  <!-- cone highlight -->
  <path d="M32 7.8c1.7 4.2 3.1 10.4 4.1 17l.5 3.2c-3.1 1.2-6.2 1.1-8.8-.2l.6-3c1-6.6 2-12.8 3.6-17z" fill="#fff" opacity="0.12"/>

  <!-- band -->
  <path d="M26.2 35.6 37.8 35.6 38.9 40.2 25.1 40.2z" fill="url(#band)"/>
  <path d="M26.2 35.6 37.8 35.6" stroke="#d9b64a" stroke-width="0.65"/>
  <path d="M25.1 40.2 38.9 40.2" stroke="#d9b64a" stroke-width="0.65"/>
  <path d="M32 35.6c.4 1.8.92 2.32 2.72 2.72-1.8.4-2.32.92-2.72 2.72-.4-1.8-.92-2.32-2.72-2.72 1.8-.4 2.32-.92 2.72-2.72z" fill="#f6df8c"/>

  <!-- brim -->
  <ellipse cx="32" cy="45.4" rx="23.8" ry="3.6" fill="url(#brim)"/>
  <path d="M8.2 45.4a23.8 3.6 0 0 0 47.6 0c0 2-10.65 3.3-23.8 3.3S8.2 47.4 8.2 45.4z" fill="#6f4c09" opacity="0.55"/>
  <ellipse cx="32" cy="45.4" rx="23.8" ry="3.6" fill="none" stroke="#7d570c" stroke-width="0.45" opacity="0.65"/>
  <path d="M10.5 44.7c2.7-1.15 12-1.9 21.5-1.9s18.8.75 21.5 1.9" fill="none" stroke="#fbe9a4" stroke-width="0.45" opacity="0.5"/>
</svg>
